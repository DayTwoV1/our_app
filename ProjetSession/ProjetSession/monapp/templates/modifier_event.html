{% extends 'base.html' %}
{% block content %}
<h2>Modifier l'Événement</h2>
<form method="post">
    Titre: <input type="text" name="title" value="{{ event.title }}"><br>
    Description: <textarea name="description">{{ event.description }}</textarea><br>
    Date: <input type="text" name="date" value="{{ event.date }}"><br>
    Catégorie: <input type="text" name="category" value="{{ event.category }}"><br>
    <input type="submit" value="Mettre à jour">
</form>
{% endblock %}
